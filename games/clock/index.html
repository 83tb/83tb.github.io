<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Zegarowi Strażnicy Galaktyki</title>
  <style>
    :root {
      --ink: #eef8ff;
      --muted: #8db4cc;
      --panel: rgba(8, 19, 37, 0.90);
      --panel-strong: rgba(7, 17, 34, 0.96);
      --cyan: #38e6df;
      --lime: #67f6a3;
      --gold: #f2a84b;
      --pink: #df4c9f;
      --violet: #5f73b7;
      --danger: #f0675e;
      --ok: #61e58f;
      --shadow: 0 0 0 4px #07111f, 0 22px 0 rgba(0, 0, 0, 0.24), 0 34px 80px rgba(0, 0, 0, 0.55);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      color: var(--ink);
      font-family: "Courier New", "Trebuchet MS", system-ui, monospace;
      background:
        linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px),
        linear-gradient(0deg, rgba(255,255,255,0.03) 1px, transparent 1px),
        radial-gradient(circle at 15% 8%, rgba(56, 230, 223, 0.12), transparent 28%),
        radial-gradient(circle at 78% 62%, rgba(223, 76, 159, 0.12), transparent 36%),
        linear-gradient(145deg, #030611 0%, #081728 44%, #180b25 100%);
      background-size: auto, 24px 24px, auto, auto, auto;
    }

    button {
      font: inherit;
    }

    #gameShell {
      position: relative;
      width: 100vw;
      height: 100vh;
      display: grid;
      place-items: center;
      isolation: isolate;
    }

    #gameCanvas {
      width: min(100vw, calc(100vh * 16 / 9));
      height: min(100vh, calc(100vw * 9 / 16));
      display: block;
      border-radius: 0;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      box-shadow: var(--shadow), inset 0 0 0 3px #1c3554, inset 0 0 0 6px #030611;
      background: #050b18;
    }

    .screen {
      position: absolute;
      inset: 0;
      z-index: 20;
      display: grid;
      place-items: center;
      padding: 22px;
      background:
        linear-gradient(90deg, rgba(56,230,223,0.06) 1px, transparent 1px),
        linear-gradient(0deg, rgba(56,230,223,0.06) 1px, transparent 1px),
        rgba(2, 7, 18, 0.86);
      background-size: 18px 18px;
      backdrop-filter: blur(4px);
    }

    .screen.hidden,
    .hidden {
      display: none !important;
    }

    .panel {
      width: min(980px, 94vw);
      max-height: min(92vh, 820px);
      overflow: auto;
      padding: clamp(20px, 3vw, 34px);
      border: 3px solid #2f5872;
      border-radius: 0;
      background:
        linear-gradient(90deg, rgba(56,230,223,0.07) 1px, transparent 1px),
        linear-gradient(0deg, rgba(56,230,223,0.07) 1px, transparent 1px),
        linear-gradient(145deg, rgba(9, 22, 41, 0.96), rgba(12, 17, 43, 0.94));
      background-size: 16px 16px, 16px 16px, auto;
      box-shadow: var(--shadow);
    }

    .panel.narrow {
      width: min(760px, 94vw);
    }

    .eyebrow {
      color: var(--gold);
      font-size: 0.94rem;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      text-shadow: 2px 2px 0 #1b1117;
    }

    h1,
    h2 {
      margin: 0;
      letter-spacing: 0;
      line-height: 1.02;
    }

    h1 {
      max-width: 760px;
      font-size: clamp(2.25rem, 7vw, 5.8rem);
      text-shadow: 3px 3px 0 #09101d, 6px 6px 0 #1f3350, 0 0 18px rgba(56, 230, 223, 0.26);
    }

    h2 {
      font-size: clamp(1.7rem, 4vw, 3.2rem);
    }

    p {
      color: var(--muted);
      font-size: clamp(1rem, 2.2vw, 1.18rem);
      line-height: 1.55;
    }

    .hero-layout {
      display: grid;
      grid-template-columns: minmax(0, 1.15fr) minmax(240px, 0.85fr);
      gap: clamp(18px, 4vw, 36px);
      align-items: center;
    }

    .hero-art {
      min-height: 320px;
      position: relative;
      border-radius: 0;
      overflow: hidden;
      background:
        linear-gradient(90deg, rgba(56,230,223,0.11) 1px, transparent 1px),
        linear-gradient(0deg, rgba(56,230,223,0.08) 1px, transparent 1px),
        radial-gradient(circle at 78% 24%, rgba(223, 76, 159, 0.26), transparent 32%),
        linear-gradient(160deg, rgba(5, 13, 28, 0.96), rgba(15, 22, 46, 0.92));
      background-size: 18px 18px, 18px 18px, auto, auto;
      border: 3px solid #2f5872;
      box-shadow: inset 0 0 0 3px #07111f, 8px 8px 0 rgba(0,0,0,0.32);
    }

    .hero-art::before {
      content: "";
      position: absolute;
      width: 172px;
      height: 172px;
      left: 48%;
      top: 46%;
      transform: translate(-50%, -50%);
      border-radius: 50%;
      background:
        linear-gradient(90deg, transparent 0 22%, rgba(255,255,255,0.12) 22% 26%, transparent 26% 100%),
        radial-gradient(circle at 36% 30%, #fff4b2 0 0.48rem, transparent 0.54rem),
        radial-gradient(circle at 50% 50%, #f2a84b 0 36%, #cf6758 37% 58%, #5269a8 59% 100%);
      box-shadow: 0 0 0 4px #07111f, 0 0 0 8px #38e6df, 0 0 34px rgba(56, 230, 223, 0.34);
    }

    .hero-art::after {
      content: "";
      position: absolute;
      width: 250px;
      height: 54px;
      left: 48%;
      top: 46%;
      transform: translate(-50%, -50%) rotate(-12deg);
      border: 5px solid rgba(56, 230, 223, 0.62);
      border-left-color: transparent;
      border-right-color: transparent;
      border-radius: 50%;
      filter: drop-shadow(0 0 8px rgba(56, 230, 223, 0.65));
    }

    .tiny-ship,
    .tiny-robot,
    .tiny-sword,
    .tiny-astronaut,
    .tiny-astronaut span {
      position: absolute;
    }

    .tiny-ship,
    .tiny-robot,
    .tiny-sword,
    .tiny-astronaut {
      filter: drop-shadow(0 0 12px rgba(83, 225, 255, 0.48));
    }

    .tiny-ship {
      width: 108px;
      height: 54px;
      left: 10%;
      top: 18%;
      z-index: 1;
      border-radius: 0;
      background: linear-gradient(90deg, #6b7f99, #38e6df 55%, #24364e);
      clip-path: polygon(0 55%, 58% 10%, 100% 50%, 58% 90%);
      box-shadow: inset -8px -8px 0 rgba(0,0,0,0.28);
    }

    .tiny-robot {
      right: 13%;
      bottom: 15%;
      z-index: 2;
      width: 74px;
      height: 86px;
      border-radius: 0;
      background: linear-gradient(180deg, #b7d1d9, #38e6df);
      box-shadow: 0 0 0 4px #07111f, inset -8px -10px 0 rgba(30, 77, 150, 0.38);
    }

    .tiny-robot::before,
    .tiny-robot::after {
      content: "";
      position: absolute;
      top: 24px;
      width: 12px;
      height: 12px;
      border-radius: 0;
      background: #142650;
    }

    .tiny-robot::before {
      left: 20px;
    }

    .tiny-robot::after {
      right: 20px;
    }

    .tiny-sword {
      width: 12px;
      height: 136px;
      right: 28%;

      border-radius: 0;
      background: linear-gradient(180deg, transparent 0 12%, #82fff0 13% 82%, #45536f 83% 100%);
      box-shadow: 0 0 12px #38e6df, 0 0 28px rgba(56, 230, 223, 0.65);
      transform: rotate(35deg);
      z-index: 1;
    }

    .tiny-astronaut {
      left: 10%;
      bottom: 10%;
      width: 176px;
      height: 226px;
      filter: drop-shadow(10px 10px 0 rgba(0,0,0,0.34));
      z-index: 3;
    }

    .tiny-astronaut .pack {
      left: 16px;

      height: 82px;

    .tiny-astronaut .torso {
      left: 50px;

      background: #1b2a45;

    .tiny-astronaut .chest {
      left: 66px;

      width: 46px;
      height: 38px;
      background:
        linear-gradient(90deg, #38e6df 0 34%, transparent 34% 44%, #f2a84b 44% 62%, transparent 62% 72%, #61e58f 72%);
      box-shadow: 0 0 0 5px #07111f;

    .tiny-astronaut .head {

    .tiny-astronaut .hair {

    .tiny-astronaut .eye-a,
    .tiny-astronaut .eye-b {

    .tiny-astronaut .helmet {

    }

    .tiny-astronaut .arm-a,

    .tiny-astronaut .arm-a {

    }

    .tiny-astronaut .leg-a {

    .tiny-astronaut .leg-b {
      left: 98px;
    }

    .tiny-astronaut {
      left: 7%;
      bottom: 4%;
      width: 192px;
      height: 246px;
      filter: drop-shadow(12px 12px 0 rgba(0,0,0,0.38));
      z-index: 3;
    }

    .tiny-astronaut span {
      image-rendering: pixelated;
    }

    .tiny-astronaut .pack {
      left: 24px;

      width: 34px;
      height: 84px;
      background: linear-gradient(180deg, #30475e, #182536);
      box-shadow: 0 0 0 5px #050b15, inset -7px -8px 0 #0b1625, inset 0 14px 0 #496276;

      box-shadow:

      left: 74px;

        linear-gradient(90deg, transparent 0 10%, #38e6df 10% 62%, transparent 62% 100%),

        0 0 0 5px #050b15,

    .tiny-astronaut .belt {

      box-shadow: 0 0 0 5px #050b15, inset 28px 0 0 #d0d7d8, inset 36px 4px 0 #526575, inset 58px 0 0 #c06d37;

    }

    .tiny-astronaut .neck {
      left: 69px;

      box-shadow: 0 0 0 6px #050b15, inset -9px -8px 0 #bd7258, inset 14px 0 0 rgba(255,255,255,0.16);

    }

    .tiny-astronaut .hair {
      left: 52px;
      top: 16px;
      width: 78px;
      height: 34px;
      background:
        linear-gradient(90deg, #9c562f 0 28%, #5d2c22 28% 56%, #301a19 56% 100%);
      box-shadow:
        0 0 0 5px #050b15,
        9px -7px 0 #6a3324,
        24px -9px 0 #3b201d,
        47px -5px 0 #2c1716,
        inset 0 10px 0 rgba(230, 137, 70, 0.25);

    .tiny-astronaut .eye-b {

    .tiny-astronaut .eye-a {

    .tiny-astronaut .eye-b {

    .tiny-astronaut .shoulder-a,

    .tiny-astronaut .glove-a {

    }

    .tiny-astronaut .glove-b {

    }

    .tiny-astronaut .leg-a {

    .tiny-astronaut .leg-b {

      background: #303335;

      height: 60px;
      background: #d8e5e8;
      box-shadow: 0 0 0 6px #050b15, inset 9px 12px 0 #38e6df, inset -12px -14px 0 #30475e;
      z-index: 5;
    }

    .tiny-astronaut .visor {
      left: 12px;
      bottom: 22px;
      width: 38px;
      height: 22px;
      background: #07111f;
      box-shadow: 0 0 0 4px #38e6df, inset 8px 4px 0 rgba(255,255,255,0.24);
      z-index: 6;
    }

    .actions,
    .row-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
      margin-top: 22px;
    }

    .btn {
      min-height: 48px;
      padding: 13px 18px;
      border: 3px solid #07111f;
      border-radius: 0;
      color: #07111f;
      font-weight: 900;
      cursor: pointer;
      background: linear-gradient(180deg, #ffd779, #f2a84b 58%, #8e5438);
      box-shadow: 5px 5px 0 #07111f, inset 0 3px 0 rgba(255, 255, 255, 0.46);
      transition: transform 0.16s ease, filter 0.16s ease;
    }

    .btn:hover {
      transform: translateY(-2px);
      filter: brightness(1.06);
    }

    .btn:active {
      transform: translateY(1px) scale(0.99);
    }

    .btn.secondary {
      color: var(--ink);
      background: #17243d;
      box-shadow: 5px 5px 0 #07111f, inset 0 0 0 2px #2f5872;
    }

    .btn.green {
      background: linear-gradient(180deg, #9efcb4, #61e58f 58%, #288f6e);
      box-shadow: 5px 5px 0 #07111f, inset 0 3px 0 rgba(255, 255, 255, 0.46);
    }

    .level-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
      margin: 22px 0;
    }

    .level-card {
      min-height: 158px;
      padding: 18px;
      border: 3px solid #2f5872;
      border-radius: 0;
      color: var(--ink);
      text-align: left;
      cursor: pointer;
      background:
        linear-gradient(90deg, rgba(56,230,223,0.06) 1px, transparent 1px),
        linear-gradient(145deg, rgba(12, 29, 52, 0.96), rgba(18, 25, 55, 0.92));
      background-size: 14px 14px, auto;
      box-shadow: 6px 6px 0 rgba(0, 0, 0, 0.38);
    }

    .level-card strong {
      display: block;
      font-size: 1.2rem;
      color: #fff;
      margin-bottom: 8px;
    }

    .level-card span {
      display: block;
      color: var(--muted);
      line-height: 1.38;
    }

    .tutorial-list {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
      margin: 18px 0;
    }

    .tip {
      padding: 14px 16px;
      border-radius: 0;
      background: #0d1b32;
      border: 2px solid #2f5872;
      color: #c9e3ef;
      line-height: 1.45;
    }

    #hud {
      position: absolute;
      z-index: 8;
      top: max(12px, env(safe-area-inset-top));
      right: max(12px, env(safe-area-inset-right));
      display: flex;
      flex-wrap: wrap;
      gap: 9px;
      justify-content: flex-end;
      max-width: min(720px, 58vw);
      pointer-events: none;
    }

    .hud-pill {
      min-height: 38px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      border-radius: 0;
      background: #081322;
      border: 2px solid #2f5872;
      color: #eaf3ff;
      font-weight: 800;
      box-shadow: 4px 4px 0 #030611;

        return level?.stageCount || level?.tasks?.length || 1;
      }

      function isTerminalStage(levelIndex = state.levelIndex, stageIndex = state.stageIndex) {
        const total = levelStageCount(levelIndex);
        return stageIndex >= Math.max(0, total - 5);
      }

      function minuteLabelsForStage(levelIndex = state.levelIndex, stageIndex = state.stageIndex) {
        if (stageIndex >= 5) {
          return [];
        }
        if (levelIndex === 1) {
          return [15, 30, 45];
        }
        if (levelIndex === 2 || levelIndex === 3) {
          return [5, 10, 15, 20, 25, 30, 35, 40, 45, 50, 55];
        }
        return [];
      }

      const hourNames = ["", "pierwsza", "druga", "trzecia", "czwarta", "piąta", "szósta", "siódma", "ósma", "dziewiąta", "dziesiąta", "jedenasta", "dwunasta"];
      const hourCaseNames = ["", "pierwszej", "drugiej", "trzeciej", "czwartej", "piątej", "szóstej", "siódmej", "ósmej", "dziewiątej", "dziesiątej", "jedenastej", "dwunastej"];

      function normalizeHour(hour) {
        return ((hour - 1 + 12) % 12) + 1;
      }

      function randomInt(min, max) {
        return Math.floor(Math.random() * (max - min + 1)) + min;
      }

      function buildAnswers(correct, makeWrong) {
        const answers = [correct];
        let guard = 0;
        while (answers.length < 3 && guard < 80) {
          const candidate = makeWrong();
          if (!answers.includes(candidate)) {
            answers.push(candidate);
          }
          guard += 1;
        }
        return answers;
      }

      function quarterAnswerLabel(hour, minute) {
        const nextHour = normalizeHour(hour + 1);
        if (minute === 15) {
          return `kwadrans po ${hourCaseNames[hour]} (${formatTime(hour, minute)})`;
        }
        if (minute === 30) {
          return `wpół do ${hourCaseNames[nextHour]} (${formatTime(hour, minute)})`;
        }
        return `za kwadrans ${hourNames[nextHour]} (${formatTime(hour, minute)})`;
      }

      function randomQuestionForLevel(levelIndex) {
        if (levelIndex === 0) {
          const hour = randomInt(1, 12);
          const correct = hourNames[hour];
          return q(
            hour,
            0,
            correct,
            buildAnswers(correct, () => hourNames[randomInt(1, 12)]),
            `Długa wskazówka jest na 12, więc jest równo. Krótka wskazuje ${hour}.`
          );
        }

        if (levelIndex === 1) {
          const hour = randomInt(1, 12);
          const minute = [15, 30, 45][randomInt(0, 2)];
          const nextHour = normalizeHour(hour + 1);
          const correct = quarterAnswerLabel(hour, minute);
          const explanation = minute === 15
            ? `Długa wskazówka jest na 3, więc to 15 minut: kwadrans po ${hourCaseNames[hour]}.`
            : minute === 30
              ? `Długa wskazówka jest na 6, więc to 30 minut. Mówimy: wpół do ${hourCaseNames[nextHour]}.`
              : `Długa wskazówka jest na 9, więc zostało 15 minut do następnej godziny: ${hourNames[nextHour]}.`;
          return q(
            hour,
            minute,
            correct,
            buildAnswers(correct, () => quarterAnswerLabel(randomInt(1, 12), [15, 30, 45][randomInt(0, 2)])),
            explanation
          );
        }

        if (levelIndex === 2) {
          const hour = randomInt(1, 12);
          const minute = randomInt(1, 11) * 5;
          const minuteMark = minute / 5;
          const correct = formatTime(hour, minute);
          return q(
            hour,
            minute,
            correct,
            buildAnswers(correct, () => formatTime(randomInt(1, 12), randomInt(1, 11) * 5)),
            `Długa wskazówka jest na ${minuteMark}. ${minuteMark} razy 5 minut to ${minute} minut, czyli ${correct}.`
          );
        }

        const hour = randomInt(1, 12);
        let minute = randomInt(1, 59);
        while (minute % 5 === 0) {
          minute = randomInt(1, 59);
        }
        const correct = formatTime(hour, minute);
        const roundedMinute = clamp(Math.round(minute / 5) * 5, 1, 59);
        return q(
          hour,
          minute,
          correct,
          buildAnswers(correct, () => {
            const variant = randomInt(0, 2);
            if (variant === 0) return formatTime(hour, roundedMinute === minute ? clamp(minute + 1, 1, 59) : roundedMinute);
            if (variant === 1) return formatTime(normalizeHour(hour + 1), minute);
            return formatTime(randomInt(1, 12), randomInt(1, 59));
          }),
          `Policz małe kreski. Długa wskazówka jest na ${minute}. minucie, więc to ${correct}.`
        );
      }

      function formatTime(hour, minute) {
        return `${hour}:${String(minute).padStart(2, "0")}`;
      }

      function createStageTask(level) {
        const question = randomQuestionForLevel(state.levelIndex);
        return {
          ...question,
          answerMode: isTerminalStage(state.levelIndex, state.stageIndex) ? "terminal" : "lever",
          minuteLabels: minuteLabelsForStage(state.levelIndex, state.stageIndex)

      function decoratePlatform(platform, index) {
        const canFloat = platform.w <= 220 && platform.y < 635 && !platform.deck && !platform.safeZone;
        return {
          ...platform,
          baseY: platform.y,
          floatAmp: canFloat ? (5 + index % 3 * 2) * 4 : 0,
          floatSpeed: canFloat ? 1.05 + index % 4 * 0.18 : 0,
          floatPhase: canFloat ? Math.random() * TAU + index * 0.7 : 0
        };
      }

      function platformY(platform, time = state.stageTime) {
        const baseY = platform.baseY ?? platform.y;
        if (!platform.floatAmp) return baseY;
        return Math.round(baseY + Math.sin(time * platform.floatSpeed + platform.floatPhase) * platform.floatAmp);
      }

      function resolvedPlatform(platform, time = state.stageTime) {
        return { ...platform, y: platformY(platform, time) };
      }

      function applyQuestion(question, answerMode = question.answerMode || "lever") {
        state.currentQuestion = question;
        state.answerMode = answerMode;
        state.activeLever = null;
        state.activeTerminal = false;
        state.terminal = answerMode === "terminal"
          ? { x: 2350, y: 420, w: 136, h: 120, pulse: 0, error: 0 }
          : null;
        if (answerMode === "terminal") {
          state.answerLevers = [];
          return;
        }

        const shuffled = shuffle(question.answers.slice());
        const xs = [2098, 2290, 2482];
        state.answerLevers = shuffled.map((answer, index) => ({
          x: xs[index],
          y: 420,
          w: 42,
          h: 72,
          label: answer,
          correct: answer === question.correct,
          pulled: false,
          pulse: 0,
          shake: 0
        }));
      }

      function shuffle(items) {
        for (let i = items.length - 1; i > 0; i -= 1) {
          const j = Math.floor(Math.random() * (i + 1));
          [items[i], items[j]] = [items[j], items[i]];
        }
        return items;
      }

      function initAudio() {
        if (!audioCtx) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          if (AudioContext) {
            audioCtx = new AudioContext();
          }
        }
        if (audioCtx && audioCtx.state === "suspended") {
          audioCtx.resume();
        }
        ensureMusicMaster();
      }

      function playTone(frequency, duration, type, gainValue, delay = 0) {
        if (!audioCtx) return;
        const now = audioCtx.currentTime + delay;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(frequency, now);
        gain.gain.setValueAtTime(0.0001, now);
        gain.gain.exponentialRampToValueAtTime(gainValue, now + 0.015);
        gain.gain.exponentialRampToValueAtTime(0.0001, now + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(now);
        osc.stop(now + duration + 0.03);
      }

      function playSuccess() {
        playTone(523.25, 0.18, "sine", 0.08);
        playTone(659.25, 0.18, "sine", 0.07, 0.09);
        playTone(783.99, 0.24, "triangle", 0.07, 0.18);
      }

      function playWrong() {
        playTone(220, 0.16, "triangle", 0.055);
        playTone(196, 0.18, "sine", 0.045, 0.12);
      }

      function playPortal() {
        playTone(392, 0.16, "sine", 0.06);
        playTone(784, 0.32, "triangle", 0.045, 0.08);
      }

      function ensureMusicMaster() {
        if (!audioCtx || music.master) return;
        music.master = audioCtx.createGain();
        music.master.gain.value = state.musicEnabled ? 0.16 : 0;
        music.master.connect(audioCtx.destination);
      }

      function updateMusicButton() {
        const label = musicLabel();
        musicButton.textContent = label;
        musicButton.setAttribute("aria-pressed", String(state.musicEnabled));
        musicButton.classList.toggle("off", !state.musicEnabled);
        screen.querySelectorAll("[data-action='toggleMusic']").forEach((button) => {
          button.textContent = label;
        });
      }

      function loadMusicPreference() {
        try {
          const saved = localStorage.getItem("zegarowi-straznicy-muzyka");
          if (saved !== null) state.musicEnabled = saved === "true";
        } catch (error) {
          state.musicEnabled = true;
        }
        updateMusicButton();
      }

      function saveMusicPreference() {
        try {
          localStorage.setItem("zegarowi-straznicy-muzyka", String(state.musicEnabled));
        } catch (error) {
          // Muzyka ma działać także wtedy, gdy localStorage jest niedostępne.
        }
      }

      function toggleMusic() {
        state.musicEnabled = !state.musicEnabled;
        saveMusicPreference();
        if (state.musicEnabled) {
          initAudio();
          startMusic(state.playing ? "heroic" : "moonlight");
        } else {
          stopMusic();
        }
        updateMusicButton();
      }

      function setMusicTrack(track) {
        const profileKey = musicProfileKey(track);
        const changed = music.track !== track || music.profileKey !== profileKey;
        if (changed) {
          music.track = track;
          music.profileKey = profileKey;
          resetMusicTimeline();
        }
        if (state.musicEnabled && audioCtx) {
          startMusic(track);
        } else {
          updateMusicButton();
        }
      }

      function resetMusicTimeline() {
        const profile = music.track === "heroic" ? activeHeroicProfile() : null;
        const config = music.track === "moonlight"
          ? { tempo: 54, stepsPerBeat: 3, totalSteps: 96 }
          : { tempo: profile.tempo, stepsPerBeat: 4, totalSteps: 512 };
        music.beatSeconds = 60 / config.tempo;
        music.stepsPerBeat = config.stepsPerBeat;
        music.totalSteps = config.totalSteps;
        music.step = 0;
        music.nextTime = audioCtx ? audioCtx.currentTime + 0.08 : 0;
        music.profileKey = musicProfileKey(music.track);
      }

      function startMusic(track = music.track) {
        if (!state.musicEnabled || !audioCtx) {
          updateMusicButton();
          return;
        }
        ensureMusicMaster();
        const profileKey = musicProfileKey(track);
        if (music.track !== track || music.profileKey !== profileKey) {
          music.track = track;
          music.profileKey = profileKey;
          resetMusicTimeline();
        } else if (!music.nextTime || music.nextTime < audioCtx.currentTime) {
          resetMusicTimeline();
        }
        music.master.gain.cancelScheduledValues(audioCtx.currentTime);
        music.master.gain.setTargetAtTime(music.track === "moonlight" ? 0.13 : 0.16, audioCtx.currentTime, 0.18);
        if (!music.timer) {
          music.timer = setInterval(scheduleMusic, 90);
        }
        scheduleMusic();
        updateMusicButton();
      }

      function musicProfileKey(track) {
        if (track !== "heroic") return track;
        return `${track}:${state.levelIndex}:${state.stageIndex}:${state.mode}`;
      }

      function activeHeroicProfile() {
        const base = levelMusicProfiles[state.levelIndex] || levelMusicProfiles[0];
        const variant = stageMusicVariants[state.stageIndex % stageMusicVariants.length] || stageMusicVariants[0];
        return {
          ...base,
          tempo: base.tempo + variant.tempoAdd,
          transpose: base.transpose + variant.transposeAdd,
          barOffset: base.barOffset + variant.barShift,
          density: base.density * variant.density,
          accentGain: base.accentGain * variant.accent,
          stageColor: variant.color
        };
      }

      function stopMusic() {
        if (music.timer) {
          clearInterval(music.timer);
          music.timer = null;
        }
        if (audioCtx && music.master) {
          music.master.gain.cancelScheduledValues(audioCtx.currentTime);
          music.master.gain.setTargetAtTime(0.0001, audioCtx.currentTime, 0.08);
        }
      }

      function scheduleMusic() {
        if (!audioCtx || !state.musicEnabled || !music.master) return;
        const stepSeconds = music.beatSeconds / music.stepsPerBeat;
        const horizon = audioCtx.currentTime + 1.15;
        if (music.nextTime < audioCtx.currentTime) {
          music.nextTime = audioCtx.currentTime + 0.04;
        }
        while (music.nextTime < horizon) {
          if (music.track === "moonlight") {
            scheduleMoonlightStep(music.step, music.nextTime);
          } else {
            scheduleHeroicStep(music.step, music.nextTime);
          }
          music.step = (music.step + 1) % music.totalSteps;
          music.nextTime += stepSeconds;
        }
      }

      function scheduleHeroicStep(step, time) {
        const profile = activeHeroicProfile();
        const stepInBar = step % 16;
        const rawBar = Math.floor(step / 16);
        const bar = (rawBar + profile.barOffset) % heroicBars.length;
        const data = heroicBars[bar];
        const bass = data.bass + profile.transpose + profile.bassOctave;
        const chord = data.chord.map((note) => note + profile.transpose);
        const motif = [chord[2], chord[2], chord[4] || chord[3] + 7, chord[3] || chord[2] + 3];
        const arpeggio = [chord[1], chord[2], chord[3], chord[4] || chord[2] + 7, chord[3], chord[2], chord[1], chord[2]]
          .map((note) => note + profile.arpeggioOctave);
        const phrase = Math.floor(rawBar / 8);
        const dynamic = data.dyn * (phrase === 2 ? 1.08 : 1);
        const arpIndex = (step + profile.stageColor) % arpeggio.length;

        playMusicNote(arpeggio[arpIndex], time, 0.18, "strings", 0.34 * dynamic * profile.stringGain * profile.density);
        if ((phrase === 2 || profile.density > 1.1) && step % 2 === 1) {
          playMusicNote((arpeggio[(arpIndex + 3) % arpeggio.length] || chord[2]) + 12, time, 0.12, "strings", 0.13 * dynamic * profile.stringGain * profile.density);
        }

        if (stepInBar === 0 || stepInBar === 8) {
          playMusicNote(bass, time, profile.stageColor === 3 ? 0.78 : 0.55, "bass", 0.78 * dynamic * profile.bassGain);
          playMusicNote(bass + 12, time, 0.30, "bass", 0.32 * dynamic * profile.bassGain);
        }

        const motifIndex = profile.motif.indexOf(stepInBar);
        if (motifIndex !== -1) {
          const longNote = motifIndex === profile.motif.length - 1;
          const octaveKick = profile.stageColor === 1 && motifIndex >= 2 ? 12 : 0;
          playMusicNote(motif[motifIndex % motif.length] + octaveKick, time, longNote ? 0.72 : 0.18, "brass", (longNote ? 0.78 : 0.46) * dynamic * profile.brassGain);
        }

        if (profile.accentBars.includes(bar) && stepInBar === 0) {
          playMusicChord(chord.slice(1).concat([chord[2] + 12]), time, 0.46, "accent", 0.70 * dynamic * profile.accentGain);
        }

        if ((bar === 23 || bar === 31) && [0, 4, 8, 12].includes(stepInBar)) {
          playMusicChord([bass + 24, chord[2] + 12, chord[3] + 12], time, 0.14, "accent", 0.56 * dynamic * profile.accentGain);
        }

        if ((bar >= 8 && bar <= 11 && stepInBar === 4) || (profile.stageColor === 1 && stepInBar === 10)) {
          playMusicNote((chord[4] || chord[3]) + 12, time, 1.1, "flute", 0.24 * dynamic * profile.fluteGain);
        }

        if (profile.sparkle > 0.5 && step % (profile.stageColor === 1 ? 3 : 6) === 0) {
          const sparkleNote = chord[(step + rawBar) % chord.length] + 24;
          playMusicNote(sparkleNote, time, 0.10, "flute", 0.08 * dynamic * profile.sparkle);
        }

        if (profile.stageColor === 2 && [4, 12].includes(stepInBar)) {
          playMusicChord([chord[1], chord[3], chord[4] || chord[3] + 4].map((note) => note + 12), time, 0.20, "accent", 0.22 * dynamic * profile.accentGain);
        }

        if (profile.stageColor === 3 && stepInBar === 0) {
          playMusicNote(Math.max(24, bass - 12), time, 1.35, "bass", 0.38 * dynamic * profile.bassGain);
        }
      }

      function scheduleMoonlightStep(step, time) {
        const stepInBar = step % 12;
        const bar = Math.floor(step / 12) % moonlightBars.length;
        const data = moonlightBars[bar];
        const triplet = step % 3;
        const pattern = [data.chord[2], data.chord[3], data.chord[4] || data.chord[3] + 4];

        playMusicNote(pattern[triplet], time, 0.70, "piano", triplet === 0 ? 0.34 : 0.25);
        if (stepInBar === 0) {
          playMusicNote(data.bass, time, 3.8, "pianoBass", 0.48);
          playMusicNote(data.bass + 12, time + 0.02, 3.2, "pianoBass", 0.22);
        }
        if (stepInBar === 3 || stepInBar === 9) {
          playMusicNote(data.melody, time, 1.6, "pianoLead", 0.30);
        }
      }

      function playMusicChord(notes, time, beats, instrument, velocity) {
        notes.forEach((note, index) => {
          playMusicNote(note, time + index * 0.006, beats, instrument, velocity * (index === 0 ? 0.92 : 1));
        });
      }

      function playMusicNote(midi, time, beats, instrument, velocity = 1) {
        if (!audioCtx || !music.master) return;
        const preset = musicPreset(instrument);
        const duration = Math.max(0.045, beats * music.beatSeconds);
        const release = preset.release;
        const level = Math.max(0.0001, preset.gain * velocity);
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        const filter = audioCtx.createBiquadFilter();

        osc.type = preset.type;
        osc.frequency.setValueAtTime(midiToFrequency(midi), time);
        if (preset.detune) osc.detune.setValueAtTime(preset.detune, time);
        filter.type = "lowpass";
        filter.frequency.setValueAtTime(preset.filter, time);
        filter.Q.setValueAtTime(preset.q, time);

        gain.gain.setValueAtTime(0.0001, time);
        gain.gain.exponentialRampToValueAtTime(level, time + preset.attack);
        gain.gain.setTargetAtTime(level * preset.sustain, time + Math.max(preset.attack, duration * 0.42), duration * 0.32);
        gain.gain.exponentialRampToValueAtTime(0.0001, time + duration + release);

        osc.connect(filter);
        filter.connect(gain);
        gain.connect(music.master);
        osc.start(time);
        osc.stop(time + duration + release + 0.05);

        if (preset.secondType) {
          const osc2 = audioCtx.createOscillator();
          osc2.type = preset.secondType;
          osc2.frequency.setValueAtTime(midiToFrequency(midi), time);
          osc2.detune.setValueAtTime(preset.secondDetune || 0, time);
          osc2.connect(filter);
          osc2.start(time);
          osc2.stop(time + duration + release + 0.05);
        }
      }

      function musicPreset(instrument) {
        const presets = {
          strings: { type: "sawtooth", secondType: "triangle", secondDetune: 5, gain: 0.010, attack: 0.01, sustain: 0.56, release: 0.08, filter: 1750, q: 0.65 },
          brass: { type: "square", secondType: "sawtooth", secondDetune: -7, gain: 0.020, attack: 0.012, sustain: 0.64, release: 0.10, filter: 1050, q: 0.55 },
          bass: { type: "triangle", secondType: "sine", secondDetune: -4, gain: 0.025, attack: 0.012, sustain: 0.70, release: 0.18, filter: 650, q: 0.55 },
          accent: { type: "sawtooth", secondType: "square", secondDetune: 3, gain: 0.018, attack: 0.006, sustain: 0.52, release: 0.12, filter: 1250, q: 0.80 },
          flute: { type: "sine", secondType: "triangle", secondDetune: 6, gain: 0.015, attack: 0.035, sustain: 0.78, release: 0.22, filter: 2200, q: 0.45 },
          piano: { type: "triangle", secondType: "sine", secondDetune: 4, gain: 0.020, attack: 0.006, sustain: 0.34, release: 0.46, filter: 1900, q: 0.50 },
          pianoBass: { type: "triangle", secondType: "sine", secondDetune: -5, gain: 0.026, attack: 0.010, sustain: 0.42, release: 0.72, filter: 850, q: 0.42 },
          pianoLead: { type: "sine", secondType: "triangle", secondDetune: 3, gain: 0.022, attack: 0.020, sustain: 0.72, release: 0.62, filter: 1800, q: 0.45 }
        };
        return presets[instrument] || presets.piano;
      }

      function midiToFrequency(midi) {
        return 440 * Math.pow(2, (midi - 69) / 12);
      }

      function setRobot(text, duration = 4200) {
        robotSpeech.textContent = text;
        robotSpeech.classList.remove("hidden");
        robotTimer = duration;
      }

      function showFeedback(title, text, type = "ok", duration = 2500) {
        feedback.className = `${type} visible`;
        feedback.innerHTML = `<strong>${title}</strong><small>${text}</small>`;
        feedbackTimer = duration;
      }

      function openTerminal() {
        if (!state.terminal || state.stageSolved || player.dead) return;
        state.terminalOpen = true;
        actionQueued = false;
        jumpQueued = false;
        keys.left = false;
        keys.right = false;
        keys.jump = false;
        keys.action = false;
        keys.down = false;
        terminalInput.value = "";
        terminalMessage.textContent = "Wpisz godzinę cyframi. Dwukropek i kropka działają tak samo.";
        drawTerminalClockPreview();
        terminalOverlay.classList.remove("hidden");
        setTimeout(() => terminalInput.focus(), 0);
      }

      function closeTerminal(restoreFocus = true) {
        state.terminalOpen = false;
        terminalOverlay.classList.add("hidden");
        if (restoreFocus) {
          terminalInput.blur();
        }
      }

      function simplifyPolishText(value) {
        const map = { ą: "a", ć: "c", ę: "e", ł: "l", ń: "n", ó: "o", ś: "s", ż: "z", ź: "z" };
        return String(value).toLowerCase().replace(/[ąćęłńóśżź]/g, (letter) => map[letter] || letter);
      }

      function polishHourFromInput(value) {
        const compact = simplifyPolishText(value).replace(/[^a-z]/g, "");
        for (let i = 1; i <= 12; i += 1) {
          if (compact === simplifyPolishText(hourNames[i]) || compact === simplifyPolishText(hourCaseNames[i])) {
            return i;
          }
        }
        return null;
      }

      function normalizeTypedTime(value) {
        let raw = String(value).trim().toLowerCase();
        if (!raw) return null;
        raw = raw.replace(/[.,：]/g, ":").replace(/\s+/g, "");
        const namedHour = polishHourFromInput(raw);
        if (namedHour) {
          return formatTime(namedHour, 0);
        }

        let hour = null;
        let minute = null;
        if (raw.includes(":")) {
          const parts = raw.split(":");
          if (parts.length !== 2 || !/^\d{1,2}$/.test(parts[0]) || !/^\d{1,2}$/.test(parts[1])) return null;
          hour = Number(parts[0]);
          minute = Number(parts[1]);
        } else if (/^\d{1,4}$/.test(raw)) {
          if (raw.length <= 2) {
            hour = Number(raw);
            minute = 0;
          } else if (raw.length === 3) {
            hour = Number(raw.slice(0, 1));
            minute = Number(raw.slice(1));
          } else {
            hour = Number(raw.slice(0, 2));
            minute = Number(raw.slice(2));
          }
        }

        if (hour === 0) hour = 12;
        if (!Number.isInteger(hour) || !Number.isInteger(minute) || hour < 1 || hour > 12 || minute < 0 || minute > 59) {
          return null;
        }
        return formatTime(hour, minute);
      }

      function isCorrectTypedTime(value, question) {
        return normalizeTypedTime(value) === question.digital;
      }

      function drawTerminalClockPreview() {
        const question = state.currentQuestion;
        if (!question || !terminalClockCtx) return;
        const c = terminalClockCtx;
        const cw = terminalClock.width;
        const ch = terminalClock.height;
        const cx = cw / 2;
        const cy = ch / 2;
        const r = 92;
        const minuteLabels = question.minuteLabels || [];
        c.imageSmoothingEnabled = false;
        c.clearRect(0, 0, cw, ch);
        c.fillStyle = "#07111f";
        c.fillRect(0, 0, cw, ch);
        c.fillStyle = "#edf7fa";
        c.beginPath();
        c.arc(cx, cy, r, 0, TAU);
        c.fill();
        c.strokeStyle = "#d8fbff";
        c.lineWidth = 5;
        c.stroke();
        c.strokeStyle = "#07111f";
        c.lineWidth = 6;
        c.beginPath();
        c.arc(cx, cy, r - 7, 0, TAU);
        c.stroke();

        for (let i = 0; i < 60; i += 1) {
          const angle = i / 60 * TAU - Math.PI / 2;
          const major = i % 5 === 0;
          const quarter = i % 15 === 0;
          const len = quarter ? 18 : major ? 14 : 7;
          c.strokeStyle = quarter ? "#020711" : major ? "#07111f" : "rgba(7,17,31,0.60)";
          c.lineWidth = quarter ? 4 : major ? 3 : 1.4;
          c.beginPath();
          c.moveTo(cx + Math.cos(angle) * (r - len - 5), cy + Math.sin(angle) * (r - len - 5));
          c.lineTo(cx + Math.cos(angle) * (r - 9), cy + Math.sin(angle) * (r - 9));
          c.stroke();
        }

        c.textAlign = "center";
        c.textBaseline = "middle";
        c.font = "900 21px Courier New, monospace";
        for (let n = 1; n <= 12; n += 1) {
          const angle = n / 12 * TAU - Math.PI / 2;
          const tx = cx + Math.cos(angle) * r * 0.67;
          const ty = cy + Math.sin(angle) * r * 0.67 + 1;
          const padW = n >= 10 ? 27 : 20;
          c.fillStyle = "rgba(210,226,232,0.94)";
          c.fillRect(Math.round(tx - padW / 2), Math.round(ty - 10), padW, 20);
          c.fillStyle = "#07111f";
          c.fillText(String(n), tx, ty);
        }

        if (minuteLabels.length) {
          c.font = "900 13px Courier New, monospace";
          for (const minuteValue of minuteLabels) {
            const angle = minuteValue / 60 * TAU - Math.PI / 2;
            const tx = cx + Math.cos(angle) * r * 0.89;
            const ty = cy + Math.sin(angle) * r * 0.89;
            const label = String(minuteValue);
            const padW = label.length > 1 ? 26 : 18;
            c.fillStyle = "rgba(7,17,31,0.90)";
            c.fillRect(Math.round(tx - padW / 2), Math.round(ty - 8), padW, 16);
            c.fillStyle = "#b9ffff";
            c.fillText(label, tx, ty + 1);
          }
        }

        const minuteAngle = question.minute / 60 * TAU - Math.PI / 2;
        const hourAngle = ((question.hour % 12) + question.minute / 60) / 12 * TAU - Math.PI / 2;
        c.lineCap = "round";
        c.strokeStyle = "#c07a45";
        c.lineWidth = 8;
        c.beginPath();
        c.moveTo(cx + Math.cos(hourAngle + Math.PI) * r * 0.08, cy + Math.sin(hourAngle + Math.PI) * r * 0.08);
        c.lineTo(cx + Math.cos(hourAngle) * r * 0.40, cy + Math.sin(hourAngle) * r * 0.40);
        c.stroke();
        c.strokeStyle = "#38e6df";
        c.lineWidth = 5;
        c.beginPath();
        c.moveTo(cx + Math.cos(minuteAngle + Math.PI) * r * 0.10, cy + Math.sin(minuteAngle + Math.PI) * r * 0.10);
        c.lineTo(cx + Math.cos(minuteAngle) * r * 0.84, cy + Math.sin(minuteAngle) * r * 0.84);
        c.stroke();
        c.fillStyle = "#07111f";
        c.beginPath();
        c.arc(cx, cy, 8, 0, TAU);
        c.fill();
        c.fillStyle = "#dffbff";
        c.beginPath();
        c.arc(cx - 2, cy - 2, 3, 0, TAU);
        c.fill();
      }

      function submitTerminalAnswer(event) {
        event.preventDefault();
        if (!state.terminalOpen || !state.currentQuestion) return;
        const typed = terminalInput.value;
        const terminal = state.terminal || { x: player.x + player.w / 2, y: player.y };
        const sourceX = terminal.x;
        const sourceY = terminal.y - 82;
        closeTerminal();
        player.answerCooldown = 0.9;
        player.actionCooldown = 0.35;

        if (isCorrectTypedTime(typed, state.currentQuestion)) {
          if (state.terminal) state.terminal.pulse = 1;
          addBurst(sourceX, sourceY, levels[state.levelIndex].theme[1], 30);
          playSuccess();
          state.stageSolved = true;
          state.gateOpen = true;
          updateHud();
          showFeedback("Kod przyjęty!", `To ${state.currentQuestion.digital}. Portal jest otwarty!`, "ok");
          setRobot(`Poprawnie: ${state.currentQuestion.explanation}`, 5600);
          return;
        }

        addBurst(sourceX, sourceY, "#ff8f9f", 24);
        playWrong();
        showFeedback("Błędny kod!", `${state.currentQuestion.explanation} Etap zaraz zacznie się od początku.`, "try", 4300);
        setRobot("Komputer odrzucił kod. Po restarcie wpisz godzinę w formacie 7:05.", 4300);
        restartStageWithFlash();
      }

      function triggerAnswer(lever) {
        if (!state.playing || player.dead || player.answerCooldown > 0 || state.stageSolved && !state.boss) return;
        player.answerCooldown = 0.9;
        player.actionCooldown = 0.35;
        lever.pulled = true;

        if (lever.correct) {
          lever.pulse = 1;
          addBurst(lever.x + lever.w / 2, lever.y - 62, levels[state.levelIndex].theme[1], 26);
          playSuccess();

          if (state.boss) {
            state.boss.hits += 1;
            state.boss.index += 1;
            if (state.boss.index < state.boss.questions.length) {
              showFeedback("Celny odczyt!", `Zawirowanie słabnie. Trafienia: ${state.boss.hits}/3.`, "ok");
              setRobot("Jeszcze jedna dźwignia. Oddychaj spokojnie i policz minuty.", 3600);
              setTimeout(() => {
                if (state.playing && state.boss && !state.stageSolved) {
                  applyQuestion(state.boss.questions[state.boss.index]);
                  state.stageTime = 0;
                  state.hintShown = false;
                }
              }, 850);
              return;
            }
          }

          state.stageSolved = true;
          state.gateOpen = true;
          updateHud();
          showFeedback(randomMotivation(), `To ${state.currentQuestion.digital}. Portal jest otwarty!`, "ok");
          setRobot(`Poprawnie: ${state.currentQuestion.explanation}`, 5600);
        } else {
          lever.shake = 0.45;
          addBurst(lever.x + lever.w / 2, lever.y - 54, "#ff8f9f", 22);
          playWrong();
          showFeedback("Zła dźwignia!", `${state.currentQuestion.explanation} Etap zaraz zacznie się od początku.`, "try", 4200);
          setRobot("Impuls czasu trafia bohatera. Po restarcie spróbuj z właściwą dźwignią.", 4200);
          restartStageWithFlash();
        }
      }

      function restartStageWithFlash() {
        player.dead = true;
        player.vx = 0;
        player.vy = -260;
        state.resetTimer = 1.15;
      }

      function addBurst(x, y, color, count) {
        for (let i = 0; i < count; i += 1) {
          const angle = Math.random() * TAU;
          const speed = 70 + Math.random() * 260;
          state.particles.push({
            x,
            y,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed - 60,
            life: 0.5 + Math.random() * 0.75,
            maxLife: 1.2,
            color,
            r: 2 + Math.random() * 4
          });
        }
      }

      function update(dt) {
        if (!state.playing) return;

        state.stageTime += dt;
        if (feedbackTimer > 0) {
          feedbackTimer -= dt * 1000;
          if (feedbackTimer <= 0) {
            feedback.classList.remove("visible");
          }
        }
        if (robotTimer > 0) {
          robotTimer -= dt * 1000;
          if (robotTimer <= 0) {
            robotSpeech.classList.add("hidden");
          }
        }

        if (state.levelIndex === 3 && !state.stageSolved && state.stageTime > 7 && !state.hintShown) {
          state.hintShown = true;
          setRobot("Podpowiedź: podświetliłem długą wskazówkę. Policz małe kreski minutowe.", 5200);
        }

        if (state.terminalOpen) {
          actionQueued = false;
          jumpQueued = false;
          updateParticles(dt);
          return;
        }

        if (state.resetTimer > 0) {
          state.resetTimer -= dt;
          player.vy += 1200 * dt;
          player.y += player.vy * dt;
          player.x += Math.sin(state.resetTimer * 32) * 1.6;
          updateParticles(dt);
          if (state.resetTimer <= 0) {
            setupStage({ preserveLayout: true });
          }
          actionQueued = false;
          return;
        }

        const left = keys.left ? 1 : 0;
        const right = keys.right ? 1 : 0;
        const dir = right - left;
        const accel = player.onGround ? 3200 : 2100;
        const maxSpeed = 430;
        const friction = player.onGround ? 2600 : 600;
        const canClimb = canUseLadder();
        player.onLadder = canClimb && rectsOverlap(playerHitbox(), ladderRect());

        if (dir !== 0) {
          player.vx += dir * accel * dt;
          player.vx = clamp(player.vx, -maxSpeed, maxSpeed);
          player.facing = dir;
        } else {
          player.vx = approach(player.vx, 0, friction * dt);
        }

        if (player.onLadder) {
          player.coyote = 0;
          player.onGround = false;
          if (keys.jump) {
            player.vy = -300;
          } else if (keys.down) {
            player.vy = 260;
          } else {
            player.vy = 0;
          }
          jumpQueued = false;
        } else {
          player.coyote = player.onGround ? 0.1 : Math.max(0, player.coyote - dt);
        }

        if (!player.onLadder && jumpQueued && (player.onGround || player.coyote > 0)) {
          player.vy = -760;
          player.onGround = false;
          player.coyote = 0;
          playTone(330, 0.08, "triangle", 0.035);
        }
        jumpQueued = false;

        if (!player.onLadder) {
          player.vy += 1800 * dt;
          player.vy = Math.min(player.vy, 980);
        }
        player.answerCooldown = Math.max(0, player.answerCooldown - dt);
        player.actionCooldown = Math.max(0, player.actionCooldown - dt);

        const previous = {
          x: player.x,
          y: player.y,
          bottom: player.y + player.h,
          right: player.x + player.w
        };

        player.x += player.vx * dt;
        handleBounds();
        handleCratePush(previous);
        handleGateCollision(previous);

        player.y += player.vy * dt;
        player.onGround = false;
        collidePlatforms(previous, dt);
        collideCrateVertical(previous);
        handleGateCollision(previous);
        handleLaserCollision();

        state.activeLever = getNearbyLever();
        state.activeTerminal = getNearbyTerminal();
        if (actionQueued) {
          if (state.activeTerminal && player.actionCooldown <= 0.02) {
            player.actionCooldown = 0.35;
            openTerminal();
          } else if (state.activeLever && player.actionCooldown <= 0.02) {
            triggerAnswer(state.activeLever);
          } else if (!state.gateOpen && !state.stageSolved && player.actionCooldown <= 0.02) {
            player.actionCooldown = 0.35;
            setRobot(state.answerMode === "terminal" ? "Podejdź bliżej komputera bramy i naciśnij spację." : "Podejdź bliżej świecącej dźwigni i naciśnij spację.", 2600);
          }
          actionQueued = false;
        }

        if (player.y > H + 70) {
          showFeedback("Kosmiczna przepaść!", "Etap zaczyna się od początku. Użyj platform i skrzyni spokojnie.", "try", 3000);
          setRobot("To był upadek w próżnię. Wracamy na start etapu.", 3000);
          restartStageWithFlash();
        }

        if (state.gateOpen && rectsOverlap(player, portalRect())) {
          playPortal();
          showStageComplete();
        }

        updateParticles(dt);
        updateCamera();
      }

      function approach(value, target, amount) {
        if (value < target) return Math.min(value + amount, target);
        if (value > target) return Math.max(value - amount, target);
        return target;
      }

      function clamp(value, min, max) {
        return Math.max(min, Math.min(max, value));
      }

      function handleBounds() {
        player.x = clamp(player.x, 12, state.worldWidth - player.w - 20);
      }

      function handleGateCollision(previous) {
        if (state.gateOpen) return;
        const gate = gateRect();
        if (!rectsOverlap(player, gate)) return;

        if (previous.right <= gate.x && player.vx > 0) {
          player.x = gate.x - player.w;
          player.vx = 0;
        } else if (previous.x >= gate.x + gate.w && player.vx < 0) {
          player.x = gate.x + gate.w;
          player.vx = 0;
        } else if (previous.bottom <= gate.y && player.vy > 0) {
          player.y = gate.y - player.h;
          player.vy = 0;
          player.onGround = true;
        } else if (previous.y >= gate.y + gate.h && player.vy < 0) {
          player.y = gate.y + gate.h;
          player.vy = 0;
        } else {
          player.x = gate.x - player.w - 1;
          player.vx = 0;
        }
      }

      function handleCratePush(previous) {
        const crate = state.crate;
        if (!crate || player.dead || !rectsOverlap(player, crate)) return;

        if (previous.right <= crate.x && player.vx > 0) {
          const overlap = player.x + player.w - crate.x;
          const nextX = clamp(crate.x + overlap, crate.minX, crate.maxX);
          crate.glow = 0.8;
          crate.x = nextX;
          player.x = crate.x - player.w;
          if (nextX >= crate.maxX - 0.1) {
            player.vx = 0;
          } else {
            player.vx *= 0.72;
          }
        } else if (previous.x >= crate.x + crate.w && player.vx < 0) {
          const overlap = crate.x + crate.w - player.x;
          const nextX = clamp(crate.x - overlap, crate.minX, crate.maxX);
          crate.glow = 0.8;
          crate.x = nextX;
          player.x = crate.x + crate.w;
          if (nextX <= crate.minX + 0.1) {
            player.vx = 0;
          } else {
            player.vx *= 0.72;
          }
        }
      }

      function collideCrateVertical(previous) {
        const crate = state.crate;
        if (!crate || !rectsOverlap(player, crate)) return;

        if (previous.bottom <= crate.y + 6 && player.vy >= 0) {
          player.y = crate.y - player.h;
          player.vy = 0;
          player.onGround = true;
        } else if (previous.y >= crate.y + crate.h - 4 && player.vy < 0) {
          player.y = crate.y + crate.h;
          player.vy = 40;
        } else if (previous.right <= crate.x && player.vx > 0) {
          player.x = crate.x - player.w;
          player.vx = 0;
        } else if (previous.x >= crate.x + crate.w && player.vx < 0) {
          player.x = crate.x + crate.w;
          player.vx = 0;
        }
      }

      function collidePlatforms(previous, dt) {
        const platforms = getPlatforms();
        const previousTime = Math.max(0, state.stageTime - dt);
        for (const rawPlatform of platforms) {
          const p = resolvedPlatform(rawPlatform);
          const prevP = resolvedPlatform(rawPlatform, previousTime);
          const wasOverPlatform = previous.right > prevP.x + 4 && previous.x < prevP.x + prevP.w - 4;
          const isOverPlatform = player.x + player.w > p.x + 4 && player.x < p.x + p.w - 4;
          const wasStandingOnTop = wasOverPlatform && previous.bottom >= prevP.y - 12 && previous.bottom <= prevP.y + 10;
          const closeToCurrentTop = player.y + player.h >= p.y - 18 && player.y + player.h <= p.y + 36;

          if (wasStandingOnTop && isOverPlatform && closeToCurrentTop && player.vy >= 0) {
            player.y = p.y - player.h;
            player.vy = 0;
            player.onGround = true;
            continue;
          }

          if (!rectsOverlap(player, p)) continue;

          if (previous.bottom <= prevP.y + 6 && player.vy >= 0) {
            player.y = p.y - player.h;
            player.vy = 0;
            player.onGround = true;
          } else if (previous.y >= prevP.y + prevP.h - 4 && player.vy < 0) {
            player.y = p.y + p.h;
            player.vy = 40;
          } else if (previous.right <= p.x && player.vx > 0) {
            player.x = p.x - player.w;
            player.vx = 0;
          } else if (previous.x >= p.x + p.w && player.vx < 0) {
            player.x = p.x + p.w;
            player.vx = 0;
          }
        }
      }

      function getPlatforms() {
        return state.layout?.platforms || [
          { x: -80, y: 650, w: 370, h: 90, active: true },
          { x: 1420, y: 650, w: 780, h: 90, active: true, safeZone: true },
          { x: 2700, y: 650, w: 460, h: 90, active: true },
          { x: 42, y: 575, w: 220, h: 32, active: true },
          { x: 318, y: 598, w: 110, h: 26, active: true },
          { x: 492, y: 542, w: 132, h: 26, active: true },
          { x: 732, y: 598, w: 132, h: 26, active: true },
          { x: 1002, y: 560, w: 132, h: 26, active: true },
          { x: 1220, y: 590, w: 132, h: 26, active: true },
          { x: 2020, y: 420, w: 650, h: 32, active: true, deck: true }
        ];
      }

      function handleLaserCollision() {
        if (player.dead || state.stageSolved || state.gateOpen) return;
        const lasers = state.layout?.lasers || [];
        const hit = lasers.find((laser) => rectsOverlap(playerHitbox(), laser));
        if (!hit) return;

        addBurst(player.x + player.w / 2, player.y + player.h / 2, "#f0675e", 24);
        playWrong();
        showFeedback("Laser czasu!", "Przeskocz czerwone wiązki. Etap zaczyna się od początku.", "try", 3200);
        setRobot("Pionowy laser jest aktywną przeszkodą. Poczekaj na dobrą wysokość platformy i skocz wcześniej.", 4200);
        restartStageWithFlash();
      }

      function gateRect() {
        return { x: 2700, y: 332, w: 48, h: 320 };
      }

      function ladderRect() {
        const gate = gateRect();
        return { x: gate.x - 28, y: gate.y + 8, w: gate.w + 56, h: gate.h - 8 };
      }

      function canUseLadder() {
        return state.gateOpen && !player.dead;
      }

      function portalRect() {
        return { x: 2870, y: 480, w: 110, h: 170 };
      }

      function playerHitbox() {
        return {
          x: player.x + 7,
          y: player.y + 7,
          w: player.w - 14,
          h: player.h - 11
        };
      }

      function getNearbyLever() {
        if (!state.answerLevers.length || state.stageSolved || player.dead) return null;
        const px = player.x + player.w / 2;
        const py = player.y + player.h / 2;
        return state.answerLevers.find((lever) => {
          const lx = lever.x + lever.w / 2;
          const ly = lever.y - 28;
          return Math.abs(px - lx) < 58 && Math.abs(py - ly) < 94;
        }) || null;
      }

      function getNearbyTerminal() {
        if (!state.terminal || state.stageSolved || player.dead) return false;
        const px = player.x + player.w / 2;
        const py = player.y + player.h / 2;
        const terminal = state.terminal;
        return Math.abs(px - terminal.x) < 94 && Math.abs(py - (terminal.y - 54)) < 112;
      }

      function rectsOverlap(a, b) {
        return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
      }

      function updateParticles(dt) {
        for (let i = state.particles.length - 1; i >= 0; i -= 1) {
          const p = state.particles[i];
          p.life -= dt;
          p.x += p.vx * dt;
          p.y += p.vy * dt;
          p.vy += 260 * dt;
          if (p.life <= 0) state.particles.splice(i, 1);
        }

        if (state.crate) {
          state.crate.glow = Math.max(0, state.crate.glow - dt * 1.6);
        }

        for (const lever of state.answerLevers) {
          lever.pulse = Math.max(0, lever.pulse - dt * 1.8);
          lever.shake = Math.max(0, lever.shake - dt * 2.5);
        }

        if (state.terminal) {
          state.terminal.pulse = Math.max(0, state.terminal.pulse - dt * 1.8);
          state.terminal.error = Math.max(0, state.terminal.error - dt * 2.5);
        }
      }

      function updateCamera() {
        const target = clamp(player.x - 420, 0, state.worldWidth - W);
        state.cameraX += (target - state.cameraX) * 0.1;
      }

      function draw(time) {
        ctx.imageSmoothingEnabled = false;
        ctx.clearRect(0, 0, W, H);
        drawBackground(time);
        drawWorld(time);
        drawQuestionPanel(time);
      }

      function drawBackground(time) {
        const level = levels[state.levelIndex] || levels[0];
        const bg = levelBackgrounds[state.levelIndex] || levelBackgrounds[0];
        ctx.fillStyle = bg.space;
        ctx.fillRect(0, 0, W, H);
        drawNebulaLayer(time, bg);
        drawSpaceBrushwork(time, bg);
        drawStarField(time, bg);
        drawLevelBackdrop(time);

        ctx.fillStyle = bg.floor;
        ctx.fillRect(0, 430, W, 290);
        ctx.fillStyle = bg.floorLine;
        for (let y = 438; y < H; y += 18) {
          ctx.fillRect(0, y, W, 2);
        }
        ctx.fillStyle = "rgba(3,9,20,0.34)";
        ctx.fillRect(0, 610, W, 110);
        drawHangarSilhouette(time, level.theme[0]);
      }

      const levelBackgrounds = [
        { space: "#02070d", floor: "#07131c", floorLine: "#0f2633", nebulaA: "rgba(38,84,92,0.34)", nebulaB: "rgba(110,49,63,0.26)", star: "#d4f3ef", haze: "#244d52", ink: "#10272a", ember: "#9d4b57" },
        { space: "#03090d", floor: "#0a151c", floorLine: "#172b34", nebulaA: "rgba(135,93,54,0.20)", nebulaB: "rgba(70,112,94,0.16)", star: "#e9dcc0", haze: "#564636", ink: "#162a26", ember: "#b06146" },
        { space: "#070609", floor: "#12141d", floorLine: "#2b2029", nebulaA: "rgba(154,69,62,0.22)", nebulaB: "rgba(173,109,55,0.24)", star: "#f1dab1", haze: "#653536", ink: "#261818", ember: "#c96a45" },
        { space: "#02070f", floor: "#071420", floorLine: "#10273f", nebulaA: "rgba(52,117,122,0.18)", nebulaB: "rgba(75,82,127,0.30)", star: "#d1eceb", haze: "#2e3c64", ink: "#101c30", ember: "#b95452" }
      ];

      function drawNebulaLayer(time, bg) {
        const drift = (state.cameraX * 0.045) % 180;
        const nebula = ctx.createLinearGradient(-100 - drift, 104, W + 180 - drift, 390);
        nebula.addColorStop(0, "rgba(11,35,64,0)");
        nebula.addColorStop(0.28, bg.nebulaA);
        nebula.addColorStop(0.58, bg.nebulaB);
        nebula.addColorStop(1, "rgba(11,35,64,0)");
        ctx.fillStyle = nebula;
        steppedPoly([
          [-60, 332], [118, 286], [324, 314], [510, 245], [722, 282],
          [926, 216], [1124, 242], [1336, 306], [1220, 374], [1012, 344],
          [800, 382], [610, 336], [392, 370], [164, 350]
        ]);
        ctx.fill();

        ctx.save();
        ctx.globalAlpha = 0.18;
        ctx.fillStyle = bg.haze;
        for (let i = 0; i < 7; i += 1) {
          const x = ((i * 245 - state.cameraX * 0.08 + time * 0.004) % (W + 260)) - 120;
          pxRect(x, 230 + (i % 3) * 34, 170 + (i % 2) * 80, 12, bg.haze);
        }
        ctx.restore();
      }

      function drawSpaceBrushwork(time, bg) {
        ctx.save();
        ctx.globalAlpha = 0.34;
        for (let i = 0; i < 24; i += 1) {
          const x = ((i * 87 - state.cameraX * (0.04 + i % 5 * 0.01) + time * 0.002) % (W + 220)) - 120;
          const y = 34 + i % 9 * 36 + Math.sin(time * 0.0008 + i) * 5;
          const w = 58 + i % 6 * 24;
          const h = 4 + i % 3 * 2;
          ctx.fillStyle = i % 3 === 0 ? bg.haze : bg.ink;
          ctx.save();
          ctx.translate(x, y);
          ctx.rotate(-0.34);
          pxRect(0, 0, w, h, ctx.fillStyle);
          pxRect(w * 0.24, h + 5, w * 0.46, 2, "rgba(196,221,213,0.09)");
          ctx.restore();
        }
        ctx.globalAlpha = 0.18;
        for (let i = 0; i < 9; i += 1) {
          const x = ((i * 190 - state.cameraX * 0.07 + 1000) % (W + 280)) - 120;
          const y = 86 + i % 4 * 62;
          ctx.fillStyle = bg.ember;
          steppedPoly([
            [x, y + 24],
            [x + 80, y],
            [x + 210, y + 12],
            [x + 138, y + 36],
            [x + 32, y + 40]
          ]);
          ctx.fill();
        }
        ctx.restore();
      }

      function drawStarField(time, bg) {
        for (const star of state.stars) {
          const x = (star.x - state.cameraX * star.speed + W * 2) % W;
          const glow = 0.45 + Math.sin(time * 0.002 + star.twinkle) * 0.35;
          ctx.globalAlpha = 0.42 + glow * 0.52;
          ctx.fillStyle = star.r > 1.7 ? bg.star : "#7fa8c4";
          const size = star.r > 1.7 ? 3 : 2;
          ctx.fillRect(Math.round(x), Math.round(star.y), size, size);
          if (star.r > 2.2) {
            ctx.fillRect(Math.round(x) - 3, Math.round(star.y) + 1, 9, 1);
            ctx.fillRect(Math.round(x) + 1, Math.round(star.y) - 3, 1, 9);
          }
        }
        ctx.globalAlpha = 1;
      }

      function drawLevelBackdrop(time) {
        if (state.levelIndex === 1) {
          drawCometAsteroidScene(time);
        } else if (state.levelIndex === 2) {
          drawMercurySunScene(time);
        } else if (state.levelIndex === 3) {
          drawJupiterMoonsScene(time);
        } else {
          drawShipSaturnScene(time);
        }
      }

      function drawShipSaturnScene(time) {
        drawPixelSaturn(1036 - state.cameraX * 0.13, 162, 96, time * 0.00025);
        drawPixelCruiser(694 - state.cameraX * 0.22, 132 + Math.sin(time * 0.001) * 4, 1.05, levels[0].theme[0]);
        drawPixelCruiser(888 - state.cameraX * 0.28, 102 + Math.sin(time * 0.0014 + 2) * 3, 0.48, "#c48658");
      }

      function drawPlanet(x, y, r, colorA, colorB, angle) {
        ctx.save();
        ctx.translate(x, y);
        ctx.rotate(angle);
        ctx.fillStyle = "#07111f";
        ctx.beginPath();
        ctx.arc(0, 0, r + 6, 0, TAU);
        ctx.fill();
        ctx.fillStyle = colorB;
        ctx.beginPath();
        ctx.arc(0, 0, r, 0, TAU);
        ctx.fill();
        ctx.fillStyle = colorA;
        for (let yy = -r + 12; yy < r; yy += 18) {
          const width = Math.sqrt(Math.max(0, r * r - yy * yy)) * 2;
          ctx.fillRect(Math.round(-width / 2), yy, Math.round(width), 8);
        }
        ctx.fillStyle = "rgba(255,255,255,0.22)";
        ctx.fillRect(-r * 0.45, -r * 0.52, r * 0.28, r * 0.14);
        ctx.strokeStyle = "#2f5872";
        ctx.lineWidth = 4;
        ctx.beginPath();
        ctx.ellipse(0, 0, r * 1.48, r * 0.34, -0.2, 0, TAU);
        ctx.stroke();
        ctx.strokeStyle = "#07111f";
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.arc(0, 0, r + 2, 0, TAU);
        ctx.stroke();
        ctx.restore();
      }

      function drawPixelSaturn(x, y, r, angle) {
        ctx.save();
        ctx.translate(x, y);
        ctx.rotate(angle);
        ctx.save();
        ctx.rotate(-0.20);
        ctx.strokeStyle = "#07111f";
        ctx.lineWidth = 18;
        ctx.beginPath();
        ctx.ellipse(0, 0, r * 1.72, r * 0.42, 0, 0, TAU);
        ctx.stroke();
        ctx.strokeStyle = "#5ea9c6";
        ctx.lineWidth = 8;
        ctx.beginPath();
        ctx.ellipse(0, 0, r * 1.62, r * 0.34, 0, 0, TAU);
        ctx.stroke();
        ctx.strokeStyle = "#f2c16f";
        ctx.lineWidth = 4;
        ctx.beginPath();
        ctx.ellipse(0, 0, r * 1.36, r * 0.26, 0, 0, TAU);
        ctx.stroke();
        ctx.restore();

        ctx.fillStyle = "#07111f";
        ctx.beginPath();
        ctx.arc(0, 0, r + 7, 0, TAU);
        ctx.fill();
        const bands = [
          ["#e9b465", -0.92, -0.58],
          ["#d66f78", -0.58, -0.32],
          ["#efc379", -0.32, -0.02],
          ["#c45d7a", -0.02, 0.28],
          ["#e4a45d", 0.28, 0.58],
          ["#bf536e", 0.58, 0.92]
        ];
        ctx.beginPath();
        ctx.arc(0, 0, r, 0, TAU);
        ctx.clip();
        bands.forEach(([color, from, to]) => {
          ctx.fillStyle = color;
          ctx.fillRect(-r, from * r, r * 2, (to - from) * r);
        });
        ctx.fillStyle = "rgba(255,255,255,0.20)";
        pxRect(-r * 0.46, -r * 0.50, r * 0.26, r * 0.13, "rgba(255,255,255,0.20)");
        ctx.fillStyle = "rgba(6,12,25,0.20)";
        pxRect(r * 0.20, -r * 0.80, r * 0.38, r * 1.55, "rgba(6,12,25,0.20)");
        ctx.restore();
      }

      function drawPixelCruiser(x, y, scale, accent) {
        ctx.save();
        ctx.translate(x, y);
        ctx.scale(scale, scale);
        ctx.fillStyle = "#07111f";
        steppedPoly([[-82, 8], [-44, -22], [22, -26], [92, -8], [122, 8], [70, 30], [-36, 28]]);
        ctx.fill();
        ctx.fillStyle = "#273039";
        steppedPoly([[-70, 6], [-36, -16], [22, -19], [84, -6], [104, 7], [62, 21], [-34, 20]]);
        ctx.fill();
        ctx.fillStyle = "#52656a";
        steppedPoly([[-28, -13], [20, -15], [64, -5], [36, 4], [-40, 4]]);
        ctx.fill();
        pxRect(-64, 3, 20, 5, "#141a20");
        pxRect(-40, -5, 20, 5, "#141a20");

        ctx.beginPath();

      function drawLasers(time) {
        const lasers = state.layout?.lasers || [];
        lasers.forEach((laser) => {
          if (laser.vertical) {
            drawVerticalLaser(laser, time);
            return;
          }
          const pulse = 0.70 + Math.sin(time * 0.014 + laser.phase) * 0.22;
          const beamY = laser.y + Math.round(Math.sin(time * 0.007 + laser.phase) * 1.4);
          const scan = ((time * 0.14 + laser.phase * 31) % (laser.w + 46)) - 23;
          const spark = Math.sin(time * 0.024 + laser.phase) > 0.35;
          ctx.save();
          pxRect(laser.x - 8, laser.y - 12, 10, laser.h + 24, "#07111f");
          pxRect(laser.x + laser.w - 2, laser.y - 12, 10, laser.h + 24, "#07111f");
          pxRect(laser.x - 5, laser.y - 8, 5, laser.h + 16, "#8a6d4c");
          pxRect(laser.x + laser.w, laser.y - 8, 5, laser.h + 16, "#8a6d4c");
          pxRect(laser.x - 3, beamY - 8, laser.w + 6, laser.h + 16, `rgba(240,103,94,${0.18 + pulse * 0.08})`);
          pxRect(laser.x, beamY - 2, laser.w, laser.h + 4, "#b62445");
          pxRect(laser.x, beamY, laser.w, laser.h, "#f0675e");
          pxRect(laser.x, beamY + 3, laser.w, Math.max(2, laser.h - 6), `rgba(255,217,135,${pulse})`);
          for (let segment = laser.x + 10; segment < laser.x + laser.w - 8; segment += 22) {
            const segmentPulse = 0.45 + Math.sin(time * 0.018 + segment * 0.08 + laser.phase) * 0.28;
            pxRect(segment, beamY - 4, 10, laser.h + 8, `rgba(255,248,180,${segmentPulse})`);
          }
          pxRect(laser.x + scan, beamY - 7, 18, laser.h + 14, "rgba(216,251,255,0.34)");
          pxRect(laser.x + scan + 5, beamY - 3, 8, laser.h + 6, "rgba(255,255,255,0.50)");
          pxRect(laser.x + 8, laser.y - 18, 42, 8, "#07111f");
          pxRect(laser.x + 12, laser.y - 16, 34, 4, "#f0675e");
          if (spark) {
            pxRect(laser.x - 18, beamY - 5, 8, 4, "#ffd987");
            pxRect(laser.x + laser.w + 13, beamY + laser.h + 1, 8, 4, "#ffd987");
            pxRect(laser.x - 25, beamY + laser.h + 6, 5, 3, "#d8fbff");
            pxRect(laser.x + laser.w + 24, beamY - 8, 5, 3, "#d8fbff");
          }
          ctx.fillStyle = "#ffd987";
          ctx.font = "900 12px Courier New, monospace";
          ctx.textAlign = "center";
          ctx.fillText("LASER", laser.x + laser.w / 2, laser.y - 10);
          ctx.restore();
        });
      }

      function drawVerticalLaser(laser, time) {
        const pulse = 0.70 + Math.sin(time * 0.014 + laser.phase) * 0.22;
        const beamX = laser.x + Math.round(Math.sin(time * 0.007 + laser.phase) * 1.4);
        const scan = ((time * 0.13 + laser.phase * 27) % (laser.h + 46)) - 23;
        const spark = Math.sin(time * 0.024 + laser.phase) > 0.35;
        ctx.save();
        pxRect(laser.x - 13, laser.y - 12, laser.w + 26, 10, "#07111f");
        pxRect(laser.x - 8, laser.y - 8, laser.w + 16, 5, "#8a6d4c");
        pxRect(laser.x - 13, laser.y + laser.h + 2, laser.w + 26, 10, "#07111f");
        pxRect(laser.x - 8, laser.y + laser.h + 4, laser.w + 16, 5, "#8a6d4c");
        pxRect(beamX - 8, laser.y - 4, laser.w + 16, laser.h + 8, `rgba(240,103,94,${0.18 + pulse * 0.08})`);
        pxRect(beamX - 3, laser.y, laser.w + 6, laser.h, "#b62445");
        pxRect(beamX, laser.y, laser.w, laser.h, "#f0675e");
        pxRect(beamX + 4, laser.y, Math.max(3, laser.w - 8), laser.h, `rgba(255,217,135,${pulse})`);
        for (let segment = laser.y + 10; segment < laser.y + laser.h - 8; segment += 22) {
          const segmentPulse = 0.45 + Math.sin(time * 0.018 + segment * 0.08 + laser.phase) * 0.28;
          pxRect(beamX - 5, segment, laser.w + 10, 10, `rgba(255,248,180,${segmentPulse})`);
        }
        pxRect(beamX - 7, laser.y + scan, laser.w + 14, 18, "rgba(216,251,255,0.34)");
        pxRect(beamX - 3, laser.y + scan + 5, laser.w + 6, 8, "rgba(255,255,255,0.50)");
        if (spark) {
          pxRect(beamX - 20, laser.y - 20, 8, 4, "#ffd987");
          pxRect(beamX + laser.w + 11, laser.y + laser.h + 15, 8, 4, "#ffd987");
          pxRect(beamX - 27, laser.y + laser.h + 22, 5, 3, "#d8fbff");
          pxRect(beamX + laser.w + 22, laser.y - 27, 5, 3, "#d8fbff");
        }
        ctx.fillStyle = "#ffd987";
        ctx.font = "900 12px Courier New, monospace";
        ctx.textAlign = "center";
        ctx.fillText("LASER", laser.x + laser.w / 2, laser.y - 20);
        ctx.restore();
      }

        ctx.textAlign = "center";

        ctx.save();

        pxRect(crate.x + crate.w - 29, crate.y + crate.h - 7, 16, 7, "#07111f");

        ctx.fillStyle = near ? "#e8fff0" : "#ffd987";
        ctx.font = "900 15px Courier New, monospace";
        ctx.textAlign = "center";
        ctx.fillText("PCHAJ", crate.x + crate.w / 2, crate.y - 13);
        const arrowOffset = Math.sin(time * 0.01) > 0 ? 0 : 4;
        pxRect(crate.x - 38 - arrowOffset, crate.y + 18, 18, 6, "#61e58f");
        pxRect(crate.x - 44 - arrowOffset, crate.y + 14, 8, 14, "#61e58f");
        pxRect(crate.x + crate.w + 20 + arrowOffset, crate.y + 18, 18, 6, "#61e58f");

      function drawTerminal(time) {
        const terminal = state.terminal;
        if (!terminal) return;
        const active = state.activeTerminal;
        const level = levels[state.levelIndex];
        const pulse = active ? 0.5 + Math.sin(time * 0.008) * 0.18 : terminal.pulse;
        const x = terminal.x;
        const y = terminal.y;
