      function drawClock(cx, cy, r, hour, minute, detailed, highlightMinute, time, minuteLabels = []) {
        ctx.save();
        ctx.translate(cx, cy);
        ctx.shadowColor = "rgba(56,230,223,0.55)";
        ctx.shadowBlur = 18;
        ctx.fillStyle = "#07111f";
        ctx.beginPath();
        ctx.arc(0, 0, r + 12, 0, TAU);
        ctx.fill();
        ctx.fillStyle = "#edf7fa";
        ctx.beginPath();
        ctx.arc(0, 0, r, 0, TAU);
        ctx.fill();
        ctx.shadowBlur = 0;
        ctx.strokeStyle = "#d8fbff";
        ctx.lineWidth = 5;
        ctx.stroke();
        ctx.strokeStyle = "#07111f";
        ctx.lineWidth = 6;
        ctx.beginPath();
        ctx.arc(0, 0, r - 8, 0, TAU);
        ctx.stroke();

        drawClockFaceOnly(0, 0, r, detailed, false, minuteLabels);

        const minuteAngle = minute / 60 * TAU - Math.PI / 2;
        const hourAngle = ((hour % 12) + minute / 60) / 12 * TAU - Math.PI / 2;

        if (highlightMinute) {
          ctx.strokeStyle = "rgba(56,230,223,0.30)";
          ctx.lineWidth = 18 + Math.sin(time * 0.008) * 3;
          ctx.lineCap = "round";
          ctx.beginPath();
          ctx.moveTo(0, 0);
          ctx.lineTo(Math.cos(minuteAngle) * r * 0.82, Math.sin(minuteAngle) * r * 0.82);
          ctx.stroke();
        }

        ctx.strokeStyle = "#c07a45";
        ctx.lineWidth = Math.max(8, r * 0.074);
        ctx.lineCap = "round";
        ctx.beginPath();
        ctx.moveTo(Math.cos(hourAngle + Math.PI) * r * 0.08, Math.sin(hourAngle + Math.PI) * r * 0.08);
        ctx.lineTo(Math.cos(hourAngle) * r * 0.40, Math.sin(hourAngle) * r * 0.40);
        ctx.stroke();
        ctx.fillStyle = "#f2a84b";
        ctx.beginPath();
        ctx.arc(Math.cos(hourAngle) * r * 0.40, Math.sin(hourAngle) * r * 0.40, Math.max(3, r * 0.028), 0, TAU);
        ctx.fill();

        ctx.strokeStyle = "#38e6df";
        ctx.lineWidth = Math.max(4, r * 0.040);
        ctx.beginPath();
        ctx.moveTo(Math.cos(minuteAngle + Math.PI) * r * 0.10, Math.sin(minuteAngle + Math.PI) * r * 0.10);
        ctx.lineTo(Math.cos(minuteAngle) * r * 0.84, Math.sin(minuteAngle) * r * 0.84);
        ctx.stroke();
        ctx.fillStyle = "#b9ffff";
        ctx.beginPath();
        ctx.arc(Math.cos(minuteAngle) * r * 0.84, Math.sin(minuteAngle) * r * 0.84, Math.max(2.5, r * 0.020), 0, TAU);
        ctx.fill();

        ctx.fillStyle = "#07111f";
        ctx.beginPath();
        ctx.arc(0, 0, Math.max(7, r * 0.07), 0, TAU);
        ctx.fill();
        ctx.fillStyle = "#dffbff";
        ctx.beginPath();
        ctx.arc(-r * 0.02, -r * 0.02, Math.max(3, r * 0.028), 0, TAU);
        ctx.fill();

        drawClockNumbers(0, 0, r, true);
        if (minuteLabels.length) {
          drawMinuteLabels(0, 0, r, minuteLabels);
        }
        ctx.restore();
      }

      function drawClockFaceOnly(cx, cy, r, detailed, showNumbers = true, minuteLabels = []) {
        ctx.save();
        ctx.translate(cx, cy);
        for (let i = 0; i < 60; i += 1) {
          const angle = i / 60 * TAU - Math.PI / 2;
          const major = i % 5 === 0;
          const quarter = i % 15 === 0;
          const len = quarter ? r * 0.18 : major ? r * 0.14 : detailed ? r * 0.075 : r * 0.045;
          ctx.strokeStyle = quarter ? "#020711" : major ? "#07111f" : detailed ? "rgba(7,17,31,0.62)" : "rgba(7,17,31,0.28)";
          ctx.lineWidth = quarter ? Math.max(4, r * 0.034) : major ? Math.max(3, r * 0.027) : Math.max(1.1, r * 0.012);
          ctx.beginPath();
          ctx.moveTo(Math.cos(angle) * (r - len - 5), Math.sin(angle) * (r - len - 5));
          ctx.lineTo(Math.cos(angle) * (r - 9), Math.sin(angle) * (r - 9));
          ctx.stroke();
        }

        if (minuteLabels.length) {
          drawMinuteLabels(0, 0, r, minuteLabels);
        }

        if (showNumbers) {
          drawClockNumbers(0, 0, r);
        }
        ctx.restore();
      }

      function drawMinuteLabels(cx, cy, r, labels) {
        ctx.save();
        ctx.translate(cx, cy);
        ctx.font = `900 ${Math.max(13, r * 0.11)}px Courier New, monospace`;
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        labels.forEach((minuteValue) => {
          const angle = minuteValue / 60 * TAU - Math.PI / 2;
          const tx = Math.cos(angle) * r * 0.88;
          const ty = Math.sin(angle) * r * 0.88;
          const label = String(minuteValue);
          const padW = label.length > 1 ? r * 0.22 : r * 0.16;
          pxRect(tx - padW / 2, ty - r * 0.066, padW, r * 0.132, "rgba(7,17,31,0.90)");
          ctx.fillStyle = "#b9ffff";
          ctx.fillText(label, tx, ty + 1);
        });
        ctx.restore();
      }

      function drawClockNumbers(cx, cy, r, withPads = false) {
        ctx.save();
        ctx.translate(cx, cy);
        ctx.fillStyle = "#07111f";
        ctx.font = `900 ${Math.max(15, r * 0.22)}px Courier New, monospace`;
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        for (let n = 1; n <= 12; n += 1) {
          const angle = n / 12 * TAU - Math.PI / 2;
          const tx = Math.cos(angle) * r * 0.67;
          const ty = Math.sin(angle) * r * 0.67 + 1;
          if (withPads) {
            const padW = n >= 10 ? r * 0.25 : r * 0.18;
            const padH = r * 0.19;
            pxRect(tx - padW / 2, ty - padH / 2, padW, padH, "rgba(210,226,232,0.92)");
          }
          ctx.fillStyle = "#07111f";
          ctx.fillText(String(n), tx, ty);
        }
        ctx.restore();
      }

      function wrapText(context, text, x, y, maxWidth, lineHeight, maxLines = 3, align = "center") {
        const words = String(text).split(" ");
        let line = "";
        const lines = [];
        for (let i = 0; i < words.length; i += 1) {
          const testLine = line ? `${line} ${words[i]}` : words[i];
          if (context.measureText(testLine).width > maxWidth && line) {
            lines.push(line);
            line = words[i];
          } else {
            line = testLine;
          }
        }
        if (line) lines.push(line);
        const visible = lines.slice(0, maxLines);
        if (lines.length > maxLines) {
          visible[maxLines - 1] = `${visible[maxLines - 1].replace(/\s+\S*$/, "")}…`;
        }

        context.textAlign = align;
        context.textBaseline = "middle";
        const startY = y - (visible.length - 1) * lineHeight / 2;
        visible.forEach((lineText, index) => {
          context.fillText(lineText, x, startY + index * lineHeight);
        });
      }

      function pxRect(x, y, w, h, color) {
        ctx.fillStyle = color;
        ctx.fillRect(Math.round(x), Math.round(y), Math.round(w), Math.round(h));
      }

      function pxStrokeRect(x, y, w, h, color, width = 3) {
        ctx.strokeStyle = color;
        ctx.lineWidth = width;
        ctx.strokeRect(Math.round(x), Math.round(y), Math.round(w), Math.round(h));
      }

      function steppedPoly(points) {
        ctx.beginPath();
        points.forEach(([x, y], index) => {
          if (index === 0) {
            ctx.moveTo(Math.round(x), Math.round(y));
          } else {
            ctx.lineTo(Math.round(x), Math.round(y));
          }
        });
        ctx.closePath();
      }

      function roundRect(context, x, y, w, h, r) {
        const radius = Math.min(r, w / 2, h / 2);
        context.beginPath();
        context.moveTo(x + radius, y);
        context.lineTo(x + w - radius, y);
        context.quadraticCurveTo(x + w, y, x + w, y + radius);
        context.lineTo(x + w, y + h - radius);
        context.quadraticCurveTo(x + w, y + h, x + w - radius, y + h);
        context.lineTo(x + radius, y + h);
        context.quadraticCurveTo(x, y + h, x, y + h - radius);
        context.lineTo(x, y + radius);
        context.quadraticCurveTo(x, y, x + radius, y);
        context.closePath();
      }

      function nextStage() {
        const level = levels[state.levelIndex];
        if (state.stageIndex < levelStageCount(level) - 1) {
          state.stageIndex += 1;
          screen.classList.add("hidden");
          touchControls.classList.add("playing");
          setupStage();
          setMusicTrack("heroic");
        } else {
          nextLevel();
        }
      }

      function nextLevel() {
        if (state.levelIndex < levels.length - 1) {
          state.levelIndex += 1;
          state.stageIndex = 0;
          screen.classList.add("hidden");
          touchControls.classList.add("playing");
          setupStage();
          setMusicTrack("heroic");
        } else {
          showStartScreen();
        }
      }

      function handleAction(target) {
        const action = target.dataset.action;
        if (!action) return;

        if (action === "adventure") {
          showTutorial({ mode: "adventure", levelIndex: 0, stageIndex: 0 });
        } else if (action === "levels") {
          showLevelScreen();
        } else if (action === "level") {
          const levelIndex = Number(target.dataset.level) || 0;
          showTutorial({ mode: "level", levelIndex, stageIndex: 0 });
        } else if (action === "tutorialStart") {
          beginGame(state.pendingStart || { mode: "adventure", levelIndex: 0, stageIndex: 0 });
        } else if (action === "nextStage") {
          nextStage();
        } else if (action === "nextLevel") {
          nextLevel();
        } else if (action === "toggleMusic") {
          toggleMusic();
        } else if (action === "back") {
          showStartScreen();
        }
      }

      function handleKeyDown(event) {
        if (state.terminalOpen) {
          if (event.code === "Escape") {
            event.preventDefault();
            closeTerminal();
          }
          return;
        }
        if (["ArrowLeft", "ArrowRight", "ArrowUp", "ArrowDown", "Space", "KeyA", "KeyD", "KeyW", "KeyS"].includes(event.code)) {
          event.preventDefault();
        }
        if (event.code === "ArrowLeft" || event.code === "KeyA") keys.left = true;
        if (event.code === "ArrowRight" || event.code === "KeyD") keys.right = true;
        if (event.code === "ArrowDown" || event.code === "KeyS") keys.down = true;
        if (event.code === "ArrowUp" || event.code === "KeyW") {
          if (!keys.jump) jumpQueued = true;
          keys.jump = true;
        }
        if (event.code === "Space") {
          if (!keys.action) actionQueued = true;
          keys.action = true;
        }
        if (event.code === "Escape") {
          showStartScreen();
        }
      }

      function handleKeyUp(event) {
        if (event.code === "ArrowLeft" || event.code === "KeyA") keys.left = false;
        if (event.code === "ArrowRight" || event.code === "KeyD") keys.right = false;
        if (event.code === "ArrowDown" || event.code === "KeyS") keys.down = false;
        if (event.code === "ArrowUp" || event.code === "KeyW") keys.jump = false;
        if (event.code === "Space") keys.action = false;
      }

      function bindTouchControls() {
        touchControls.querySelectorAll("[data-touch]").forEach((button) => {
          const control = button.dataset.touch;
          const set = (value) => {
            if (control === "left") keys.left = value;
            if (control === "right") keys.right = value;
            if (control === "jump") {
              if (value && !keys.jump) jumpQueued = true;
              keys.jump = value;
            }
            if (control === "action") {
              if (value && !keys.action) actionQueued = true;
              keys.action = value;
            }
          };
          button.addEventListener("pointerdown", (event) => {
            event.preventDefault();
            initAudio();
            button.setPointerCapture(event.pointerId);
            set(true);
          });
          button.addEventListener("pointerup", () => set(false));
          button.addEventListener("pointercancel", () => set(false));
          button.addEventListener("lostpointercapture", () => set(false));
        });
      }

      function gameLoop(timestamp) {
        const dt = Math.min(0.033, (timestamp - lastTime) / 1000 || 0);
        lastTime = timestamp;
        update(dt);
        draw(timestamp);
        requestAnimationFrame(gameLoop);
      }

      screen.addEventListener("click", (event) => {
        const target = event.target.closest("[data-action]");
        if (target) {
          initAudio();
          handleAction(target);
        }
      });

      document.getElementById("menuButton").addEventListener("click", () => {
        showStartScreen();
      });

      musicButton.addEventListener("click", () => {
        initAudio();
        toggleMusic();
      });

      terminalForm.addEventListener("submit", submitTerminalAnswer);
      terminalClose.addEventListener("click", () => closeTerminal());

      window.addEventListener("keydown", handleKeyDown, { passive: false });
      window.addEventListener("keyup", handleKeyUp);
      window.addEventListener("blur", () => {
        keys.left = false;
        keys.right = false;
        keys.jump = false;
        keys.action = false;
        keys.down = false;
      });

      loadMusicPreference();
      startStars();
      bindTouchControls();
      showStartScreen();
      requestAnimationFrame(gameLoop);
    })();
  </script>
</body>
</html>
